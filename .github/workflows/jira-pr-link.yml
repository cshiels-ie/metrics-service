name: "Jira PR Link"

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write

jobs:
  jira-pr-link:
    runs-on: ubuntu-latest

    steps:
      - name: "Extract Jira ticket from PR"
        id: jira
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          TICKET=$(echo "$PR_TITLE" | grep -oP 'AAP-\d+' | head -1 || true)

          if [[ -z "$TICKET" ]]; then
            TICKET=$(echo "$PR_BODY" | grep -oP 'AAP-\d+' | head -1 || true)
          fi

          if [[ -z "$TICKET" ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "ticket=$TICKET" >> "$GITHUB_OUTPUT"
          fi

      - name: "Check commit messages for ticket"
        if: steps.jira.outputs.found == 'false'
        id: commit-check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          TICKETS=$(gh pr view "$PR_NUMBER" \
              --repo "${{ github.repository }}" \
              --json commits \
              --jq '[.commits[] | .messageHeadline + " " + .messageBody] | join("\n")' \
              | grep -oP 'AAP-\d+' | sort -u || true)

          TICKET=$(echo "$TICKETS" | head -1)

          if [[ -z "$TICKET" ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "ticket=$TICKET" >> "$GITHUB_OUTPUT"
          fi

      - name: "Comment on PR if ticket is missing"
        if: steps.jira.outputs.found == 'false' && steps.commit-check.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          MARKER="<!-- jira-pr-link-bot -->"
          BODY="${MARKER}
          No Jira ticket was found in the PR title, description, or commit message. To link this PR to a Jira issue, add the ticket number to the title, e.g. \`[AAP-12345] Your PR title\`."

          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" | head -1 || true)

          if [[ -n "$COMMENT_ID" ]]; then
            gh api "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
              -X PATCH -f body="$BODY" || echo "::warning::Failed to update missing-ticket comment"
          else
            gh pr comment "$PR_NUMBER" \
              --repo "${{ github.repository }}" \
              --body "$BODY" || echo "::warning::Failed to post missing-ticket comment"
          fi

      - name: "Update Jira Git Pull Request field"
        id: jira-update
        if: steps.jira.outputs.found == 'true' || steps.commit-check.outputs.found == 'true'
        env:
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.BOT_JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.BOT_JIRA_API_TOKEN }}
          JIRA_PR_FIELD_ID: "customfield_10875"
          TICKET: ${{ steps.jira.outputs.ticket || steps.commit-check.outputs.ticket }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [[ -z "$JIRA_BASE_URL" || -z "$JIRA_USER_EMAIL" || -z "$JIRA_API_TOKEN" ]]; then
            echo "::warning::JIRA_BASE_URL, BOT_JIRA_EMAIL, and BOT_JIRA_API_TOKEN must be configured"
            exit 0
          fi

          python3 << 'PYEOF'
          import json, os, sys, urllib.request, urllib.error, base64

          base_url = os.environ["JIRA_BASE_URL"]
          email = os.environ["JIRA_USER_EMAIL"]
          token = os.environ["JIRA_API_TOKEN"]
          field_id = os.environ["JIRA_PR_FIELD_ID"]
          ticket = os.environ["TICKET"]
          pr_url = os.environ["PR_URL"]
          github_output = os.environ["GITHUB_OUTPUT"]

          auth = base64.b64encode(f"{email}:{token}".encode()).decode()
          headers = {
              "Authorization": f"Basic {auth}",
              "Content-Type": "application/json",
              "Accept": "application/json",
          }

          # Fetch current field value using API v3 (ADF-aware)
          get_url = f"{base_url}/rest/api/3/issue/{ticket}?fields={field_id}"
          req = urllib.request.Request(get_url, headers=headers)
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = json.loads(resp.read())
          except urllib.error.HTTPError as e:
              print(f"::warning::Failed to fetch Jira ticket {ticket} (HTTP {e.code})")
              sys.exit(0)
          except (urllib.error.URLError, TimeoutError) as e:
              print(f"::warning::Failed to fetch Jira ticket {ticket} ({e})")
              sys.exit(0)

          current_adf = data.get("fields", {}).get(field_id)

          # Check if PR URL is already linked (skip if so)
          if current_adf and isinstance(current_adf, dict):
              for block in current_adf.get("content", []):
                  for item in block.get("content", []):
                      if item.get("text") == pr_url:
                          print(f"{pr_url} already linked on {ticket}, skipping")
                          with open(github_output, "a") as f:
                              f.write("linked=true\n")
                          sys.exit(0)

          new_link = {
              "type": "text",
              "text": pr_url,
              "marks": [{"type": "link", "attrs": {"href": pr_url}}],
          }

          if current_adf and current_adf.get("content"):
              # Append to the existing paragraph
              current_adf["content"][0]["content"].append({"type": "hardBreak"})
              current_adf["content"][0]["content"].append(new_link)
              updated_adf = current_adf
          else:
              updated_adf = {
                  "type": "doc",
                  "version": 1,
                  "content": [{"type": "paragraph", "content": [new_link]}],
              }

          # Write back using API v3
          put_url = f"{base_url}/rest/api/3/issue/{ticket}"
          payload = json.dumps({"fields": {field_id: updated_adf}}).encode()
          req = urllib.request.Request(put_url, data=payload, headers=headers, method="PUT")
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  pass
              print(f"Updated {ticket} Git Pull Request field with {pr_url}")
              with open(github_output, "a") as f:
                  f.write("linked=true\n")
          except urllib.error.HTTPError as e:
              print(f"::warning::Failed to update Jira ticket {ticket} (HTTP {e.code})")
          except (urllib.error.URLError, TimeoutError) as e:
              print(f"::warning::Failed to update Jira ticket {ticket} ({e})")
          PYEOF

      - name: "Comment on PR with linked ticket"
        if: steps.jira-update.outputs.linked == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TICKET: ${{ steps.jira.outputs.ticket || steps.commit-check.outputs.ticket }}
        run: |
          MARKER="<!-- jira-pr-link-bot -->"
          BODY="${MARKER}
          This PR has been automatically linked to ${TICKET} in Jira."

          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" | head -1 || true)

          if [[ -n "$COMMENT_ID" ]]; then
            gh api "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
              -X PATCH -f body="$BODY" || echo "::warning::Failed to update linked-ticket comment"
          else
            gh pr comment "$PR_NUMBER" \
              --repo "${{ github.repository }}" \
              --body "$BODY" || echo "::warning::Failed to post linked-ticket comment"
          fi
