version: "3.8"

services:
  postgres:
    build: .
    container_name: awx-mock-db
    ports:
      - "5555:5432"
    environment:
      POSTGRES_DB: awx_mock
      POSTGRES_USER: awx
      POSTGRES_PASSWORD: awxpass
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - awx_mock_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awx -d awx_mock"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - awx-mock-network

volumes:
  awx_mock_data:
    driver: local
    name: awx_mock_data

networks:
  awx-mock-network:
    driver: bridge
    name: awx-mock-network
